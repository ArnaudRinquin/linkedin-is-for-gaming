<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Promo tiles</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #555;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* ---- small tile 440x280 ---- */
  #small-tile {
    width: 440px;
    height: 280px;
    background: #1b1f23;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    overflow: hidden;
  }
  #small-tile .pad {
    font-size: 64px;
    line-height: 1;
  }
  #small-tile .title {
    font-size: 31px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #fff;
  }
  #small-tile .title b {
    color: #70b5f9;
    font-weight: 800;
  }
  #small-tile .sub {
    font-size: 14px;
    color: #9db9ac;
  }

  /* ---- marquee tile 1400x560 ---- */
  #marquee-tile {
    width: 1400px;
    height: 560px;
    background: linear-gradient(135deg, #1b1f23 0%, #14324e 100%);
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  #marquee-tile .copy {
    flex: none;
    width: 560px;
    padding: 0 0 0 70px;
    color: #fff;
  }
  #marquee-tile .copy .pad {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 18px;
  }
  #marquee-tile .copy h1 {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.05;
    margin: 0 0 18px;
  }
  #marquee-tile .copy h1 b {
    color: #70b5f9;
    font-weight: 800;
  }
  #marquee-tile .copy ul {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 19px;
    color: #c8d5e0;
    line-height: 1.75;
  }
  #marquee-tile .shot {
    position: absolute;
    left: 640px;
    top: 48px;
    width: 900px;
    border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    transform: rotate(-2deg);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
</style>
</head>
<body>

<div id="small-tile">
  <div class="pad">🎮</div>
  <div class="title"><b>LinkedIn</b> is for gaming</div>
  <div class="sub">daily puzzles · leaderboards · nothing else</div>
</div>

<div id="marquee-tile">
  <div class="copy">
    <div class="pad">🎮</div>
    <h1><b>LinkedIn</b> is for gaming</h1>
    <ul>
      <li>🧩 Just the daily games — no feed</li>
      <li>🏆 Full connection leaderboards</li>
      <li>▶ Always know what to play next</li>
      <li>🐵 Real LinkedIn one click away</li>
    </ul>
  </div>
  <img class="shot" src="screenshots/1-hub.png" alt="">
</div>

</body>
</html>
